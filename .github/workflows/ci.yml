# Integración continua con controles de seguridad (DevSecOps). Se ejecuta en cada push y pull request a Beta y
# Principal. No usa secretos ni toca entornos reales: todo corre con datos temporales de prueba.
name: CI

on:
  push:
    branches: [Beta, Principal]
  pull_request:
    branches: [Beta, Principal]

permissions:
  contents: read

jobs:
  backend:
    name: Servidor (lint, pruebas, Bandit, pip-audit)
    runs-on: windows-latest          # producción es Windows (pywin32, impresión directa)
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check pospy tests
      - name: Pruebas (incluye autorización por rol y equipos autorizados)
        run: python -m pytest -q -p no:cacheprovider
      - name: Bandit (falla con hallazgos de severidad alta)
        run: python -m bandit -r pospy -q --severity-level high
      - name: pip-audit (vulnerabilidades conocidas)
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: Interfaz (lint, tipos, pruebas, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=moderate
      - name: npm audit (herramientas de compilación)
        run: npm audit --audit-level=high

  secrets:
    name: Secretos (gitleaks sobre todo el historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL -o gl.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gl.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
